<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }} · {{ .Site.Params.owner }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/shelf.css" | relURL }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Rahul's Library</h1>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search title or author…" autocomplete="off" spellcheck="false" aria-label="Search by title or author">
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filters"></div>
      </div>
    </div>
    <nav class="roomnav" id="roomnav" aria-label="Jump to a room"></nav>
  </header>

  <main id="library" class="library" aria-live="polite">
    <div class="loading" id="loading">Opening the library…</div>
  </main>

  <div class="empty" id="empty" hidden>No books match that search.</div>

  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="false" aria-label="Book details">
    <button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <footer class="foot">
    <span id="footcount"></span> · a personal library of <strong>{{ .Site.Params.owner }}</strong>
  </footer>

  <script>window.LIBRARY_URL = "{{ "library.json" | relURL }}";</script>
  <script src="{{ "js/shelf.js" | relURL }}"></script>
</body>
</html>
